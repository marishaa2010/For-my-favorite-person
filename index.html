<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>A Little Something For You</title>
<style>
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#111}
body{font-family:Arial,sans-serif}
button{font:inherit;border:0}
.screen{position:fixed;inset:0;display:none;align-items:center;justify-content:center;background:#111}
.screen.active{display:flex}
.artboard{position:relative;height:100vh;width:auto;aspect-ratio:2/3;max-width:100vw;overflow:hidden;background:#fff}
.artboard img.base{position:absolute;inset:0;width:100%;height:100%;object-fit:fill;user-select:none;pointer-events:none}
.hotspot{position:absolute;background:transparent;cursor:pointer;z-index:30}
.hotspot:focus-visible{outline:2px solid #fff;outline-offset:3px}
#titleOpen{left:31%;top:76.5%;width:38%;height:8.5%}
#loading{background:#fff;flex-direction:column}
.loader-wrap{width:min(78vw,430px);position:relative}
.pixel-loader{height:46px;border:5px solid #111;background:#fff;overflow:hidden;position:relative;box-shadow:0 0 0 1px #111}
.pixel-fill{height:100%;width:0;background:linear-gradient(90deg,#ef0a62 0%,#ff176f 28%,#ff4a86 52%,#ff78a5 74%,#ff9fbc 100%);position:relative}
.pixel-fill:after{content:"";position:absolute;inset:0;background:repeating-linear-gradient(90deg,transparent 0 13px,rgba(255,255,255,.16) 13px 19px);mix-blend-mode:screen}
.loading-text{margin-top:18px;text-align:center;font-family:monospace;font-weight:900;font-size:clamp(25px,6vw,43px);letter-spacing:2px;color:#111}
.loading-text::after{content:"";animation:dots 1s steps(4,end) infinite}
@keyframes dots{0%{content:""}25%{content:"."}50%{content:".."}75%{content:"..."}100%{content:""}}
.scene-art{background:#fff}
.scene-mask{position:absolute;z-index:3;pointer-events:none;background-image:url("assets/scene2.jpg");background-size:100% 100%}
.mask-card{left:2.5%;top:3.2%;width:44%;height:44.5%}
.mask-bus{left:0;top:68.7%;width:45%;height:24.5%}
.mask-cats{left:58.5%;top:70.5%;width:41.5%;height:23.5%}
.moving{position:absolute;z-index:8;pointer-events:none;will-change:transform,opacity}
.moving img{display:block;width:100%;height:100%;object-fit:contain}
#lyricCard{left:3.1%;top:3.9%;width:42.6%;height:43%;z-index:10}
#lyricCard #playHotspot{position:absolute;left:0;top:0;width:100%;height:100%;pointer-events:auto;background:transparent;z-index:50;cursor:pointer}
#bus{left:-1%;top:69.7%;width:43.9%;height:23%;z-index:12}
#cats{left:59.5%;top:71.2%;width:40.3%;height:21.8%;z-index:11}
#graves{left:58%;top:68.5%;width:41%;height:25%;opacity:0;z-index:13}
.boom{position:absolute;left:58%;top:72%;width:26%;height:20%;z-index:25;opacity:0;pointer-events:none;transform:scale(.2)}
.boom-ring{position:absolute;inset:0;border:8px solid #b3002d;border-radius:50%;box-shadow:0 0 0 10px rgba(255,70,100,.35),0 0 35px rgba(255,0,60,.45)}
.boom-word{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;font-family:Impact,Arial Black,sans-serif;font-size:clamp(28px,8vw,64px);color:#fff;text-shadow:3px 3px 0 #111,-3px 3px 0 #111,3px -3px 0 #111,-3px -3px 0 #111;transform:rotate(-8deg)}
.shake{animation:shake .18s linear infinite}
@keyframes shake{0%{transform:translate(0,0)}25%{transform:translate(-4px,2px)}50%{transform:translate(4px,-2px)}75%{transform:translate(-2px,-3px)}100%{transform:translate(2px,3px)}}
.boom.active{animation:boom 1.1s ease-out forwards}
@keyframes boom{0%{opacity:0;transform:scale(.2)}20%{opacity:1;transform:scale(1.05)}45%{opacity:1;transform:scale(.92)}100%{opacity:0;transform:scale(1.25)}}
.impact-flash{position:absolute;inset:0;background:#fff;opacity:0;z-index:24;pointer-events:none}
.impact-flash.active{animation:flash .42s ease-out}
@keyframes flash{0%{opacity:.9}100%{opacity:0}}
.next-btn{position:absolute;right:5%;bottom:4%;z-index:40;background:#8d001f;color:#fff;padding:12px 18px;border-radius:5px;font-weight:800;letter-spacing:1px;box-shadow:0 4px 0 #4d0011;opacity:0;pointer-events:none;transform:translateY(8px);transition:.35s}
.next-btn.show{opacity:1;pointer-events:auto;transform:none}
.letter-hotspot{left:20%;top:32%;width:58%;height:25%;z-index:20}
#song{position:fixed;width:1px;height:1px;opacity:0;pointer-events:none;left:-10px;top:-10px}
.open-letter-board{height:100vh;width:auto;max-width:100vw;position:relative;background:#4b0004;overflow:hidden}
.open-letter-board img{width:100%;height:100%;object-fit:contain;display:block}
@media (max-width:700px){.artboard{height:100vh;max-width:100vw}.pixel-loader{height:40px}}
</style>
</head>
<body>
<section id="page1" class="screen active"><div class="artboard" style="aspect-ratio:1077/1536"><img class="base" src="assets/title.jpg" alt=""><button id="titleOpen" class="hotspot" aria-label="Open it"></button></div></section>
<section id="loading" class="screen" aria-label="Loading"><div class="loader-wrap"><div class="pixel-loader"><div id="pixelFill" class="pixel-fill"></div></div><div class="loading-text">LOADING</div></div></section>
<section id="page2" class="screen"><div id="scene" class="artboard scene-art" style="aspect-ratio:1139/1536"><img class="base" src="assets/scene2.jpg" alt=""><div class="scene-mask mask-card"></div><div class="scene-mask mask-bus"></div><div class="scene-mask mask-cats"></div><div id="lyricCard" class="moving"><img src="assets/card.png" alt=""><button id="playHotspot" class="hotspot" aria-label="Play song"></button></div><div id="bus" class="moving"><img src="assets/bus.png" alt=""></div><div id="cats" class="moving"><img src="assets/cats.png" alt=""></div><div id="graves" class="moving"><img src="assets/graves.png" alt=""></div><div id="impactFlash" class="impact-flash"></div><div id="boom" class="boom"><div class="boom-ring"></div><div class="boom-word">BOOM!</div></div><button id="nextBtn" class="next-btn">NEXT →</button></div></section>
<section id="page3" class="screen"><div class="artboard" style="aspect-ratio:1067/1536;background:#4b0004"><img class="base" src="assets/letter-closed.jpg" alt=""><button id="letterOpen" class="hotspot letter-hotspot" aria-label="Open the letter"></button></div></section>
<section id="page4" class="screen"><div class="open-letter-board" style="aspect-ratio:686/1536"><img src="assets/letter-open.png" alt=""></div></section>
<video id="song" src="assets/song.mp4" preload="auto" playsinline></video>
<script>
(()=>{const screens={page1:document.getElementById('page1'),loading:document.getElementById('loading'),page2:document.getElementById('page2'),page3:document.getElementById('page3'),page4:document.getElementById('page4')};const show=n=>{Object.values(screens).forEach(s=>s.classList.remove('active'));screens[n].classList.add('active')};const titleOpen=document.getElementById('titleOpen'),fill=document.getElementById('pixelFill'),song=document.getElementById('song'),playHotspot=document.getElementById('playHotspot'),lyricCard=document.getElementById('lyricCard'),bus=document.getElementById('bus'),cats=document.getElementById('cats'),graves=document.getElementById('graves'),boom=document.getElementById('boom'),flash=document.getElementById('impactFlash'),nextBtn=document.getElementById('nextBtn'),scene=document.getElementById('scene');
titleOpen.addEventListener('click',()=>{show('loading');fill.style.transition='none';fill.style.width='0%';requestAnimationFrame(()=>requestAnimationFrame(()=>{fill.style.transition='width 5s linear';fill.style.width='100%'}));setTimeout(()=>{show('page2');resetScene()},5050)},{once:true});
function resetScene(){playHotspot.disabled=false;nextBtn.classList.remove('show');lyricCard.style.transition='none';bus.style.transition='none';cats.style.transition='none';graves.style.transition='none';lyricCard.style.transform='translate(0,0) scale(1)';lyricCard.style.opacity='1';bus.style.transform='translateX(0)';bus.style.opacity='1';cats.style.opacity='1';cats.classList.remove('shake');graves.style.opacity='0';graves.style.transform='translateY(12px) scale(.97)';boom.classList.remove('active');flash.classList.remove('active');song.pause();song.currentTime=0}
playHotspot.addEventListener('click',async e=>{e.stopPropagation();if(playHotspot.disabled)return;playHotspot.disabled=true;nextBtn.classList.remove('show');try{song.currentTime=0;await song.play()}catch(e){console.warn('Audio playback was blocked:',e)}lyricCard.style.transition='transform 4s cubic-bezier(.2,.75,.2,1), opacity .45s ease';lyricCard.style.transform='translate(51%,68%) scale(.72)';bus.style.transition='transform 4s cubic-bezier(.15,.8,.15,1)';bus.style.transform='translateX(135%)';setTimeout(()=>{cats.classList.add('shake');boom.classList.remove('active');flash.classList.remove('active');void boom.offsetWidth;void flash.offsetWidth;boom.classList.add('active');flash.classList.add('active');scene.animate([{transform:'translate(0,0)'},{transform:'translate(-5px,2px)'},{transform:'translate(5px,-2px)'},{transform:'translate(-4px,-1px)'},{transform:'translate(0,0)'}],{duration:450,easing:'ease-out'})},4000);setTimeout(()=>{cats.classList.remove('shake');cats.style.transition='opacity .5s ease';cats.style.opacity='0';lyricCard.style.opacity='0';bus.style.opacity='0'},8000);setTimeout(()=>{graves.style.transition='opacity 1s ease, transform 1s ease';graves.style.transform='translateY(12px) scale(.97)';graves.style.opacity='1';requestAnimationFrame(()=>{graves.style.transform='translateY(0) scale(1)'})},9000);setTimeout(()=>{nextBtn.classList.add('show');song.pause();try{song.currentTime=12}catch(e){}},12000)});
nextBtn.addEventListener('click',()=>show('page3'));document.getElementById('letterOpen').addEventListener('click',()=>show('page4'));})();
</script>
</body>
</html>
